<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha conta | Beyond Borders</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="pagina-login">

    <div class="login-container">

        <div class="login-box">

            <h1>Bem-vindo à Beyond Borders! ✈️</h1>

            <p id="boasVindas">
                Você está conectado!
            </p>

            <button onclick="window.location.href='index.html'">
                Explorar destinos
            </button>

            <button onclick="sair()" style="margin-top: 12px;">
                Sair da conta
            </button>

        </div>

    </div>

    <script>
        const usuario = JSON.parse(
            sessionStorage.getItem("usuarioLogado")
        );

        if (!usuario) {
            window.location.href = "login.html";
        } else {
            document.getElementById("boasVindas").textContent =
                "Olá, " + usuario.nome + "! Que bom ter você conosco.";
        }

        function sair() {
            sessionStorage.removeItem("usuarioLogado");
            window.location.href = "login.html";
        }
    </script>

</body>
</html>
